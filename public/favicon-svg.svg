<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#5db3b6"/>

  <g fill="none" stroke="#c5e8e6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Woman's Outer Hair and Back -->
    <path d="M 75 45 C 55 55, 55 85, 65 100" />
    
    <!-- Woman's Face, Neck, and Arm -->
    <path d="M 68 95 C 65 75, 75 55, 95 55 C 110 55, 115 65, 105 75 C 100 80, 95 85, 95 85 C 90 90, 80 85, 80 95 C 80 100, 85 105, 95 105" />
    
    <!-- Lower Back and Leg Silhouette -->
    <path d="M 65 110 C 70 135, 75 155, 65 175" />
    
    <!-- Pregnant Belly Curve -->
    <path d="M 125 115 C 145 130, 140 160, 120 175 C 110 180, 95 180, 95 180" />
    
    <!-- Medical Staff (Rod of Asclepius) -->
    <line x1="100" y1="90" x2="100" y2="180" />
    <circle cx="100" cy="90" r="2.5" fill="#c5e8e6" stroke="none" />
    
    <!-- Center Heart -->
    <path d="M 100 115 C 90 105, 75 115, 85 130 C 95 145, 100 150, 100 150 C 100 150, 105 145, 115 130 C 125 115, 110 105, 100 115 Z" />
    
    <!-- Snake Upper Coil -->
    <path d="M 130 95 C 120 90, 110 90, 105 95 C 95 105, 115 110, 115 120 C 115 130, 105 135, 105 135" />
    
    <!-- Snake Lower Coil -->
    <path d="M 95 155 C 85 160, 85 170, 95 175 C 105 180, 115 175, 110 165" />
    
    <!-- Snake Eye -->
    <circle cx="122" cy="94" r="1.5" fill="#c5e8e6" stroke="none" />
    
  </g>
</svg>
